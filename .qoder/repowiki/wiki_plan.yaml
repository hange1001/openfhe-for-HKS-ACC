version: 1

scope:
  include:
    - "src/fpga_backend/**"
    - "src/pke/lib/keyswitch/**"
    - "src/pke/include/keyswitch/**"
    - "src/pke/examples/hks-benchmark.cpp"
    - "src/core/include/FpgaManager.h"
    - "src/core/include/lattice/hal/default/**"
    - "docs/notes/**"
    - "docs/papers/**"
    - "AI_Cowork/**"
  exclude:
    - "third-party/**"
    - "benchmark/**"
    - "src/binfhe/**"
    - "docs/sphinx_rsts/**"
    - "docs/static_docs/**"
    - "docs/notes/archive/**"

repowiki:
  template: "architecture"
  notes:
    - text: "本项目是 CKKS Hybrid Key-Switching 的 CPU-FPGA 异构加速器，基于 OpenFHE + Alveo U55C + Vitis HLS 2024.1。文档语言中文为主，代码和术语保持英文。"
      author: "user"
    - text: "架构分析必须覆盖六层：L0 算法层(RNS-CKKS KeySwitch 数学)→ L1 算子划分层(循环嵌套顺序与算子粒度)→ L2 数据流调度层(DC/MP/OC 三策略)→ L3 微架构层(CG-NTT/BConv/Barrett)→ L4 物理实现层(HLS综合/时序/资源)→ L5 系统集成层(XRT/PCIe/OpenFHE接口)。"
      author: "user"
    - text: "核心设计决策已记录在 AI_Cowork/decisions.md (ADR-001~010)，wiki 应引用而非重复。关键决策：CG-NTT取代变几何NTT(ADR-003)、opcode-RPC调度(ADR-008)、Barrett替换硬件除法器(ADR-006)。"
      author: "user"
    - text: "FPGA 参数常量定义在 src/fpga_backend/include/define.h：RING_DIM=4096, PE_PARALLEL=4, LIMB_Q=3, LIMB_P=2, MAX_OUT_COLS=5, STAGE=12。所有 wiki 中引用的参数以此文件为准。"
      author: "user"
    - text: "三策略实测数据(N=4096,L=3,sizeP=2,2digits)：DC 4.47ms / MP 5.17ms / OC 5.99ms；单次offload端到端182.8μs，PCIe固定开销占32.7%。OC当前实现非真OC(仅DC+sizeP冗余)，修复方案见ADR-010。"
      author: "user"
  documents:
    - title: "系统总览与六层架构"
      goal: "一张全局图：从 CKKS 数学公式到 FPGA bitstream 的完整数据通路，标注每层的入口/出口/关键接口"
      parent: ""
      hints:
        - "引用 AI_Cowork/README.md 的两个研究轴"
        - "画出 Host(FPGA Manager) ↔ PCIe ↔ FPGA(Top opcode dispatcher) 的交互序列"
    - title: "L0-L1：算法与算子划分"
      goal: "从 HKS 数学公式推导出算子 DAG：INTT→BConv→NTT 的粒度选择、digit/tower 循环嵌套如何决定 DC/MP/OC"
      parent: ""
      hints:
        - "引用 docs/papers/content.md 的 RNS 表示章节"
        - "说明 ModUp/ModDown 展开后的三层循环 for d × for p × for n"
        - "解释 CiFlow 论文的三策略分类法如何从循环顺序导出"
    - title: "L2：数据流调度与存储模型"
      goal: "三策略的峰值缓冲公式、端到端延迟解析模型(含固定开销项)、batch depth 耦合机制"
      parent: ""
      hints:
        - "引用 docs/notes/MemoryTracker_Plan.md 的探针设计"
        - "引用 docs/notes/OC_strategy_gap_analysis.md 的 5 条 gap"
        - "核心公式：T = Σ(n_op × t_op) + V/BW + n_calls × t_fixed"
    - title: "L3：FPGA 微架构"
      goal: "CG-NTT 恒定几何蝶形核、BConv 3×5 脉动阵列、Barrett PE 的数据通路设计与时序约束"
      parent: ""
      hints:
        - "引用 docs/notes/CG-NTT-Migration-Report.md 和 cg_ntt_optimization.md"
        - "说明 perfect shuffle 地址生成、乒乓缓存、twiddle URAM 副本策略"
        - "BConv 权重驻留 vs 数据驻留的 tradeoff"
    - title: "L4：HLS 综合与物理实现"
      goal: "HLS pragma 体系(INLINE off / DATAFLOW / ARRAY_PARTITION)、资源预算(BRAM/URAM/DSP/LUT)、时序收敛策略"
      parent: ""
      hints:
        - "引用 docs/reports/bconv/ 和 Compute_CG_NTT 的 csynth/cosim 报告"
        - "ADR-007 子函数拆解解决 Slack -0.33ns 的方法"
        - "L1(512-bit AXI) / L2(DATAFLOW) / L3(URAM预加载) 三级优化路线"
    - title: "L5：系统集成与 Host 接口"
      goal: "FpgaManager XRT 封装、opcode-RPC 协议、HBM 三通道分区、OpenFHE keyswitch-hybrid.cpp 集成点"
      parent: ""
      hints:
        - "引用 docs/papers/fsm_vs_cpu_scheduling.md 的开销比判据"
        - "说明 H2D/D2H buffer 管理与 bit-reverse 软件补丁(ADR-005)"
        - "hks-benchmark.cpp 命令行入口的测量协议"

knowledgecard:
  notes:
    - text: "知识卡按六层(L0-L5)组织模块边界。每个模块卡必须包含：接口协议(输入/输出/控制信号)、数据流方向、关键性能指标、与其他层的耦合点。"
      author: "user"
    - text: "FPGA 侧核心模块：Compute_CG_NTT(蝶形核)、Compute_BConv(脉动阵列)、Top(opcode dispatcher)、arithmetic(MultMod/Barrett)。Host 侧核心模块：FpgaManager、keyswitch-hybrid(EvalKeySwitchPrecomputeCore)、HKSStrategy 枚举。"
      author: "user"
    - text: "模块间通信协议：Host→FPGA 通过 XRT bo (buffer object) + opcode 寄存器；FPGA 内部通过 BRAM scratchpad (poly_buffer_1/2, result_buffer)；FPGA→HBM 通过 512-bit AXI master burst。"
      author: "user"
