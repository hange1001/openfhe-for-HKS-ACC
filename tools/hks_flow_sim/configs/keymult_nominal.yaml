# KeyMult/Accumulate 参数：nominal（标称） 档
#
# 硬件未实现，全部为 projected。方案 §5.2 要求 optimistic/nominal/pessimistic
# 三组必须同时运行，不得对未实现模块给出伪精确单点结果。
#
# T_KM(d,t) = keymult_mul_passes * ceil(N/lanes) * modmul_ii + keymult_pipe + keymult_mem
# T_ACC(t)  = ceil(N/lanes) + accumulate_overhead
#
# 要把这三档收敛成一个数，需要方案 §11 P2 列的实测：模乘 latency/II、
# a/b 两路的顺序或并行关系、accumulate 能否与 write-back 融合、
# evk 从片上/DDR/host 供数的访问成本。在拿到这些之前只能报区间。

# 标称：填充 + 排空，中等端口争用，累加有固定开销
hardware:
  cost:
    keymult_mul_passes: 2
    modmul_ii: 1
    keymult_pipe: 38            # 填充 + 排空
    keymult_mem: 256            # 片上取数/写回争用
    accumulate_overhead: 26     # 与蝶形循环同量级的固定开销
note: "projected/nominal"
