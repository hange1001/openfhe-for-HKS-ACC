phases:

  - id: phase1
    name: "L0 算法推导 + L1 算子划分 + L2 三性能模型"
    status: in_progress   # 1.1 done (08-07)，1.3 in_progress；原 pending 是漏改
    estimate: 1 week
    depends_on: []

    steps:

      - id: 1.1
        name: "L0：闭卷手推 HKS"
        status: done          # 2026-08-04 开始，2026-08-07 完成
        deliverable_path:
          - docs/notes/L0_HKS_闭卷推导.md    # 推导正文（用户闭卷写 + 两轮审稿修订）
          - docs/notes/L0_HKS算法手推.md     # 过程与踩坑记录（6 条）+ 复习清单
          - docs/notes/L0_符号表.md          # 全项目统一符号口径，step 1.3/1.4 直接引用
        exercise_order: |
          题 1 ✅：从 CRT 推出 BConv 与它的「近似」误差界   → validation 第 1、3 条
          题 2 ✅：从 P4 倒推 digit j 的目标基             → validation 第 2 条
          题 3 ✅：ModDown 机制 + 为什么不需要 digit 分解
        derived_results: |
          【题 1】
            - 依赖表：X[i][n] 不依赖 j / W[i][j] 不依赖 n / mu_j 只依赖 j
            - 由依赖表推出：BConv 是 GEMM (K_gemm=alpha, M=K, batch=N)；
              W 复用 N=4096 次 vs X 复用 K=5 次 → weight-stationary 是算出来的不是选出来的；
              阵列 alpha×K 对应 define.h 的 LIMB_Q×MAX_OUT_COLS
            - single-tower BConv 省输出不省输入（因 X 不依赖 j）→ 支撑 step 1.3 真 OC 输入重取
            - 误差界 |u| <= alpha/2（中心剩余口径），且与 c_i 是否逆元、输入取值、素数大小无关
              → 正确性与误差界是两条独立约束
          【题 2】
            - |C_j| = l + K - alpha_j（当前 3 / 4）；只扩到 P 则只有 K=2 → 多做 75%
            - 目标基由 P4 的逐 tower 点积【倒推】而来，不是 ModUp 自选
            - evk 存储基 Q·P ≠ 运算基 Q_l·P（代码痕迹：keyswitch-hybrid.cpp:647 的 idx=sizeQ 偏移）
          【题 3】
            - ModDown 算子账：每 poly = K 个 INTT-limb + 1 BConv + l 个 NTT-limb = 6，
              两个 poly 共 12 次 → 直接命中 step 1.2 那「30 次未归属 kernel 调用」中的 12 次
            - rho 的作用是让除法合法，不是消噪声；消噪声的是 ÷P
            - 模乘 = 除法的条件：被乘数必须是 P 的整数倍
            - 噪声唯一源头是 evk 的 epsilon；BConv【不产生】噪声，只【放大】(1+alpha) 倍
              → alpha 因子的准确出处，闭合 K = alpha (+1)
          【方法论】
            - 写代码在残数层，想问题在整数层（闭卷推导 §4.5 / 手推 踩坑 ⑤）
            - 跨子问题推导前先建符号表（踩坑 ⑥ → 产出 L0_符号表.md）
        deliverable: 手写推导笔记（ModUp P1-P5 + ModDown），标注每步数据形状变化
        changes:
          - 自己画数据形状链：(N×l) → dnum×(N×a) → dnum×(N×(l+K)) → 2×(N×(l+K)) → 2×(N×l)
          - 不要抄 CiFlow Fig.1
        validation:
          - "徒手写出 BConv 求和式，指出哪些量跨 output tower 共享（x_i = c[i]·QHatInv）、哪些按列独立（QHatModp[i][j]、Barrett mu_j）"
          - "答出：为什么 digit j 要扩到 (Q_l \\ Q_j) ∪ P，而不是只扩到 P？（提示：P4 要在全基下乘 evk）"
          - "答出：为什么 P >= max digit？它和 BConv 的『近似』是什么关系？（提示：BConv 溢出误差 ~ a·Q_j，ModDown 除以 P）"
        code_anchors:
          - src/pke/lib/schemerns/rns-cryptoparameters.cpp:129-136   # sizeP = ceil(maxBits/auxBits)，K 不是自由参数
          - src/pke/lib/schemerns/rns-cryptoparameters.cpp:240-272   # ComplPartQ = (Q_l \ PartQ_j) ∪ P
          - src/pke/lib/keyswitch/keyswitch-hybrid.cpp:331-590

      - id: 1.2
        name: "L5 前置测量：三个 10 分钟实验（统一口径）"
        status: pending
        rationale: |
          现有表 5-4 的延迟列是 CPU 路径、kernel 列是 FPGA 路径，
          45 × 182.8us = 8.23ms > 报的 4.47ms，自相矛盾，不能用于标定模型。
        blocked_by: 需要 U55C 板卡；无板则本步挂起，模型标记「未上板校准」
        changes:
          - "实验 A：三策略 FPGA 路径下 Precompute 区间的【独立】计时（不要用分项加总）"
          - "实验 B：bytes 扫描，1/2/4/8 limb 一次传，各测 H2D/D2H → 分离 T_fixed 与 BW_eff"
          - "实验 C：一次传 25MB 过 PCIe 计时 → 与 HERA 的 Mult 延迟 0.3ms 对比（预期 8-28x）"
          - |
            实验 D【2026-08-13 新增，来源 q8】：量出未计时开销。
            在 FpgaManager.h 的 Execute() 函数体首尾各加一个时间戳，
            比 sum(整个函数墙钟) vs sum(h2d + kern + d2h)，差值即未计入的
            xrt::bo 分配/析构 + bo.write() x2 + bo_out.read()。
            10 分钟即可。它决定：(a) 现有全部延迟数字要修正多少；
            (b) 步 3.4「Buffer 复用」值不值得做。
            预测（先写后测，按 predict_before_measure 规则）：
              未计时开销 30-80 us/call，即真实单次 call 在 210-260 us 区间。
              依据：xrt::bo 构造含驱动 ioctl + 物理内存分配 + mmap，
              文献口径每次 10-30 us，一次调用 3 个 buffer。±15% 区间待实测对账。
        validation:
          - kernel 调用数可复现：n_call = (INTT limb + NTT limb + BConv call) + 常数，把那个常数的 30 次归属清楚
          - BW_eff 由拟合得出而非 32KB/40.6us 的单点折算
        priority: 实验 C 最高——它是整个立论的地基数

      - id: 1.3
        name: "L1：边界放置设计空间表（B0-B4）"
        status: in_progress     # 2026-08-07 起
        prereq_done_2026_08_11: |
          【Step A 完成】对表（docs/notes/L1_优化术语对表.md）
          起因：导师给出算子优化通用检查清单（并行性/数据依赖/延迟vs吞吐/计算vs带宽/
          tiling/reduction·同步·负载均衡/Amdahl·Roofline + 「从系统框图加 memory access 找瓶颈」）。
          核查结论：8 条里 5 条已答（依赖分析、复用与 stationary、peak 循环序推导、reduction、
          访存受限判定），且推得比教科书例子深，但只以项目内部语言存在。
          【真空白只有 3 个，均已写入对表 §3，待办清单见对表 §4】
            ① 延迟 vs 吞吐：L2 模型 T = 计算+传输+控制 是加号，即假设三项不重叠，
               该假设从未声明也未验证。且 8.229ms = 1829+5537+863 是【分项加总】，
               与 推导v1 §4 已查实的 CPU 路径同一个方法论问题在 FPGA 路径上重演。
               → 先查 FpgaManager 的 offload 是否阻塞，再补 max() 版模型
            ② 负载均衡：α₀=2/α₁=1 → |C₀|=3/|C₁|=4，总和 α_d+|C_d|=ℓ+K=5 恒等，
               但【分算子看】不均衡（INTT 2:1，BConv/NTT 3:4）。B0 边界下不构成问题，
               B1（每 digit 一次）下才构成 → 影响步 3.3 的 -29% 估计
            ③ 分层 Roofline：三个 AI 数字属于三条【不同】边界——
               BConv 0.23 MAC/B 是 on-chip AXI 屋顶，B0/B1/B4 0.32/0.89/2.1 是 PCIe 屋顶。
               两句话都对但不是同一个瓶颈。HERA 的图上没有 PCIe 屋顶，所以它看见的瓶颈是 NTT；
               把 PCIe 屋顶画出来才是本项目的 Fig. 1。
        order_note: |
          【2026-08-07 顺序更正】原排法是 1.2(测量) → 1.3 → 1.4，那是自下而上的排法，错了。
          理由：测量要测什么，由模型结构决定；模型的自变量由 1.3 产出。
          现在若去跑 bytes 扫描，测完还得重测（不知道该不该分离 T_fixed 与 BW_eff）。
          正确顺序：1.3 → 1.5/1.6（供给约束）→ 1.2（标定系数）→ 1.4（实例化对账）。
        rationale: |
          对本系统，「算子划分」的自由度不在「把公式切成算子」（CKKS 定死了，
          且 CiFlow §IV.D 证明算子总数与 dataflow 无关），而在「一次 offload 调用包多少个算子」。
        deliverable: B0-B4 完整表（补 HBM 侧字节 + evk 项 + 片上需求）
        output_requirement: |
          【硬要求】表格里填的必须是 (N, l, K, dnum, alpha_j, 方案) 组成的【符号式】，不是数字。
          例：DC 的 n_call 要写成 sum(alpha_j) + dnum + (sum|C_j| + sum alpha_j)，代入才等于 15。
          填数字得到一张表；填式子得到一个能预测任意参数点的模型。这是 1.3 与「数一遍」的区别。
        derived_mechanism: |
          【2026-08-07 已确立，来自 1.3 第 1 步的循环序推导】
          BConv 的三层循环 i(输入 limb) / j(输出 limb) / n(系数)：
            - 归约只沿 i；不同 n 之间零依赖 → 六种排列【全部合法】，包括 n 放最外层
            - 但 NTT/INTT 把一个 limb 内全部 N 个系数耦合 → 【融合链】里 n 不能最外层
              → 这就是 B1 边界（每 digit 一次）被 NTT 钉死在「一个完整 limb」的根源
          peak 由循环序【纯推出】的规则：
            j 在最外层  → 一次只有 1 个输出 limb 未完成 → peak = 1        (OC)
            j 不在最外层 → |C_j| 个输出 limb 同时未完成  → peak = |C_j|   (DC)
            digit 也摊开 → 所有 digit 的输出同时活着     → peak = sum|C_j| (MP)
          验算（l=3,K=2,alpha_0=2,alpha_1=1 → |C_0|=3,|C_1|=4）：
