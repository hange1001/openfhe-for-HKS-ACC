# ============================================================
# task.yaml - 机器可读的任务描述文件
# 用法：将本文件作为 AI Agent 的任务输入
# 每完成一步，更新对应 step 的 status
# 更新：2026-08-04 — 由单一 OC 修复任务改组为「全栈能力闭环」四阶段路线
# ============================================================

task:
  id: fullstack-l0-to-l5-closure
  title: 从 L0 算法到 L4 物理，把 HKS 加速器的全栈推导链走通一遍
  status: not_started
  goal: |
    目标不是发论文，是把「从算法推导到实现再回到测量」这条链在自己的项目上走通，
    形成可迁移的全栈工程能力。判据从「有没有新颖性」改为
    「每一个数字，能不能说清它是哪一层的哪个约束推出来的」。

    别人论文做过的事照做——HERA(FPGA'26) 与 CiFlow(ISPASS'24) 是参照系而非竞争者，
    有公开答案可对账，是训练条件里最好的一种。

  context: |
    L0-L5 金字塔现状（见 HKS-ACC-Portfolio.md）：
      L0 算法      读过没推过        → 空白
      L1 算子划分  空白              → 空白
      L2 调度建模  有实现无模型      → 缺预测能力（工业上有专岗：性能建模工程师）
      L3 微架构    主力，L2/L3 优化未做
      L4 物理      【欠债】只有 csynth，无 P&R 时序报告；4ns→5ns→6ns 两次降频无记录
      L5 系统集成  已通，缺 DMA 行为的定量刻画

    关键前置结论（见 docs/notes/L1L2_推导v1.md）：
      - 每算子一次 offload 的架构下，三策略 AI 恒等 → 延迟差必然在 5% 内（实测 8.04/8.23/8.46ms 印证）
      - 修 OC 的性能天花板 8%；OC + 片上驻留是 29%
      - 表 5-4 延迟列是 CPU 路径、kernel 列是 FPGA 路径，两列不同源，不能用于标定

  reference_docs:
    - docs/notes/L1L2_推导v1.md                    # 算子账 / 三模型实例化 / 口径对账
    - docs/notes/L1L2_算子划分与性能模型指南.md      # 方法论
    - docs/notes/OC_strategy_gap_analysis.md       # 注意：§4 计算量表已被推翻，Gap#1 状态标错
    - docs/papers/实验规划.md                       # 补 4-2 / 补 4-3 / 表 5-4
    - CiFlow (ISPASS'24) / HERA (FPGA'26)          # 参照系

repository:
  working_branch: main
  # 建议每个 phase 一个独立 commit

# ============================================================
# 贯穿全程的验收项（每个 phase 都要满足）
# ============================================================
global_validation:
  - id: traceability
    rule: |
      任何写进文档的数字，必须能回答「它由哪一层的哪个约束推出」。
      当前答不上来的存量问题（本任务结束前须全部答上）：
        - 6ns 是怎么定的？关键路径在哪个模块？          → phase2
        - PE_PARALLEL 到底是几？define.h=4 / cg_ntt.cpp:191 硬编码 8 / :233 注释 16 / csynth 报告对应 8
                                                        → phase2（ADR-002「统一引用常量」已被破坏）
        - 45 次 kernel 调用里那 30 次是什么？            → phase1 step 1.2
        - 787 MB/s 是带宽还是被固定开销污染的折算值？    → phase1 step 1.2
        - CG-NTT 的 bit-reversal 在哪一步被抵消的？      → phase1 step 1.5
      【2026-08-04 已答】twiddle 是否压缩存储：
        PACK_RATIO=512/64=8 是 AXI 打包比不是压缩，字节数不变（详见 open_questions q6）。
  - id: predict_before_measure
    rule: |
      任何实测之前，先写下预测值和 ±15% 区间，存入 log.md。
      测完再对账。偏差 >15% 先查漏项，禁止调系数凑数。

# ============================================================
# PHASE 1: L0 + L1 + L2 —— 算法、算子划分、三模型
# ============================================================
phases:

  - id: phase1
    name: "L0 算法推导 + L1 算子划分 + L2 三性能模型"
    status: pending
    estimate: 1 week
    depends_on: []

    steps:

      - id: 1.1
        name: "L0：闭卷手推 HKS"
        status: pending
        deliverable: 手写推导笔记（ModUp P1-P5 + ModDown），标注每步数据形状变化
        changes:
          - 自己画数据形状链：(N×l) → dnum×(N×a) → dnum×(N×(l+K)) → 2×(N×(l+K)) → 2×(N×l)
          - 不要抄 CiFlow Fig.1
        validation:
          - "徒手写出 BConv 求和式，指出哪些量跨 output tower 共享（x_i = c[i]·QHatInv）、哪些按列独立（QHatModp[i][j]、Barrett mu_j）"
          - "答出：为什么 digit j 要扩到 (Q_l \\ Q_j) ∪ P，而不是只扩到 P？（提示：P4 要在全基下乘 evk）"
          - "答出：为什么 P >= max digit？它和 BConv 的『近似』是什么关系？（提示：BConv 溢出误差 ~ a·Q_j，ModDown 除以 P）"
        code_anchors:
          - src/pke/lib/schemerns/rns-cryptoparameters.cpp:129-136   # sizeP = ceil(maxBits/auxBits)，K 不是自由参数
          - src/pke/lib/schemerns/rns-cryptoparameters.cpp:240-272   # ComplPartQ = (Q_l \ PartQ_j) ∪ P
          - src/pke/lib/keyswitch/keyswitch-hybrid.cpp:331-590

      - id: 1.2
        name: "L5 前置测量：三个 10 分钟实验（统一口径）"
        status: pending
        rationale: |
          现有表 5-4 的延迟列是 CPU 路径、kernel 列是 FPGA 路径，
          45 × 182.8us = 8.23ms > 报的 4.47ms，自相矛盾，不能用于标定模型。
        blocked_by: 需要 U55C 板卡；无板则本步挂起，模型标记「未上板校准」
        changes:
          - "实验 A：三策略 FPGA 路径下 Precompute 区间的【独立】计时（不要用分项加总）"
          - "实验 B：bytes 扫描，1/2/4/8 limb 一次传，各测 H2D/D2H → 分离 T_fixed 与 BW_eff"
          - "实验 C：一次传 25MB 过 PCIe 计时 → 与 HERA 的 Mult 延迟 0.3ms 对比（预期 8-28x）"
        validation:
          - kernel 调用数可复现：n_call = (INTT limb + NTT limb + BConv call) + 常数，把那个常数的 30 次归属清楚
          - BW_eff 由拟合得出而非 32KB/40.6us 的单点折算
        priority: 实验 C 最高——它是整个立论的地基数

      - id: 1.3
        name: "L1：边界放置设计空间表（B0-B4）"
        status: pending
        rationale: |
          对本系统，「算子划分」的自由度不在「把公式切成算子」（CKKS 定死了，
          且 CiFlow §IV.D 证明算子总数与 dataflow 无关），而在「一次 offload 调用包多少个算子」。
        deliverable: B0-B4 完整表（补 HBM 侧字节 + evk 项 + 片上需求）
        changes:
          - 每个方案算出 n_call / H2D limb / D2H limb / peak limb / AI
          - 已有初版见 L1L2_推导v1.md §四（B0=0.32, B1=0.89, B4=2.1 ops/byte）
          - 补上 evk 口径（CiFlow 表 II 的 AI 是含 evk 的，当前口径不可直接对比）
        validation:
          - 三策略的 peak_buf 能由循环序纯推出，且与修正后的 MemoryTracker 一致
          - 注意 peak 单位是补基 |C_d| = sizeQlP - alpha_d，不是 sizeP（原插桩用错单位）

      - id: 1.4
        name: "L2：三模型 v1 + 预测 + 对账"
        status: pending
        deliverable: 可执行的模型（脚本或表格），输入循环序，输出预测延迟
        design_constraint: |
          【硬约束】模型的自变量必须是 (n_call, V, peak)，这三个量由循环序推出。
          模型里若出现 `if (strategy == OC)`，那它就是查找表不是模型。
        changes:
          - "T = sum(n_op·c_op) + V/BW_eff + n_call·T_fixed"
          - c_op 来自 csynth × 上板修正系数（当前拟合值 1.35，phase2 后可换成有依据的值）
          - BW_eff 与 T_fixed 来自 step 1.2 实验 B
        validation:
          - 三策略预测 vs 实测误差 <= 15%
          - "【先写后测】预测三策略落在 5% 以内——若实测印证则模型成立且得到重要结论；若实测偏差大则模型漏项"
          - 模型能对一个从未实测过的调度点做出预测（B1 或 batch=2）

      - id: 1.5
        name: "确认 bit-reversal 在哪一步被抵消"
        status: pending
        estimate: 0.5 day
        rationale: |
          cg_ntt_reorder()（cg_ntt.cpp:140）定义了但【只被 testbench 调用】（cg_ntt_tb.cpp:497），
          top.cpp 的 Execute_NTT/Execute_INTT 路径里没有调用它；
          ADR-005 描述的「Host 端 NttForwardOffload 出口做 bit-reverse」在 FpgaManager.h:469 里也不存在。
          两种可能：A 位序已被 BuildCGTwiddle 的 perm[i]=bit_reverse(i) 吸收（大概率）；B 存在隐患。
        validation:
          - 跑 test-cg-ntt.cpp，FPGA 输出与 OpenFHE CPU NTT 输出逐元素对比
          - 结论写入 ADR-005 的修订（当前描述与代码不符）
        note: |
          相关性质（B1 融合的依据）：BConv 对系数置换不变——y[n]=sum_i x[i][n]·W[i] 是逐系数运算，
          只要 alpha 个输入 limb 用同一置换，位序可以直接穿过 BConv。
          因此 DIF-INTT → BConv → DIT-NTT 的组合里 bit-reversal 两端自动抵消，零代价。

      - id: 1.6
        name: "工业参数资源预算（纸面，不综合不上板）"
        status: pending
        estimate: 0.5 day
        rationale: |
          原 CP-012。目的不是实现工业参数，是回答「哪些结论对参数敏感」。
          参数不敏感（可留在 N=4096）：符号式算子账、位序/访问模式、时序收敛、数值正确性。
          参数敏感（必须用工业参数算）：片上容量约束、dataflow 差异、BConv/NTT 单价比、roofline 位置。
        changes:
          - "twiddle：两套架构分别算（见 open_questions q6），确认保留哪一套"
          - "poly_buffer[MAX_LIMBS][N] = 8N×8B；ping-pong buf_A/buf_B = 2N×8B；密文 = l×N×8B"
          - "对每个 N ∈ {2^12, 2^13, 2^14, 2^16} 算总片上占用 vs U55C ~43MB"
        validation:
          - 产出「能落地的最大参数点清单」
          - "回答：ADR-003（CG-NTT）的 log N 倍 twiddle 冗余在哪个 N 上变得不可接受？"
          - "回答：撞墙后要改的是常数还是微架构？（对照 HERA §3.1 的 NTT 分解）"

# ============================================================
# PHASE 2: L4 —— 把物理层的欠债还上
# ============================================================
  - id: phase2
    name: "L4 时序收敛闭环"
    status: pending
    estimate: 3-5 days
    depends_on: [phase1]
    rationale: |
      六层里唯一「做过但没闭环」的一层。
      csynth.tcl:33 是 6ns + uncertainty 0.75ns（有效 5.25ns），
      而 ADR-007 记的是 4ns 目标 / 5ns 兜底——降了两次频，没有一条记录说明原因。
      docs/reports/ 下 10 份报告全是 csynth/cosim，没有一份 P&R 后的时序报告。
      工业判据：能跑出功能是初级，能定位关键路径并做出取舍是资深。
    steps:
      - id: 2.1
        name: "跑 Vivado P&R，拿到时序报告"
        status: pending
        validation:
          - 得到 6ns 下的 WNS / TNS，以及关键路径所在模块
      - id: 2.2
        name: "定位关键路径限制者"
        status: pending
        validation:
          - "回答：能不能回到 5ns 或 4ns？不能的话卡在哪——DSP 级联？BRAM 输出寄存器？AXI 握手扇出？"
          - 得到真实的 csynth→上板修正系数，替换 phase1 里那个拟合的 1.35
      - id: 2.3
        name: "补 ADR：记录 4ns→5ns→6ns 两次降频的真实原因"
        status: pending
        files_to_modify:
          - AI_Cowork/decisions.md
          - docs/notes/PROJECT_STATUS.md   # 时序行状态更新
        validation:
          - 顺带核对 ADR-002 的 PE_PARALLEL=8 与 define.h:33 的 4 之间发生了什么

# ============================================================
# PHASE 3: 由模型选出的改造（两项都做，顺序按训练价值）
# ============================================================
  - id: phase3
    name: "改造：修 OC + B1 复合 opcode"
    status: pending
    estimate: 2 weeks
    depends_on: [phase1, phase2]
    rationale: |
      在新目标下两项都值得做，收益率不再是否决理由，「练什么能力」才是判据。
      修 OC：练 OpenFHE 库级改动 + RNS 数值正确性验证（低风险，先做）
      B1：练 HLS 复合核设计 + 片上 buffer 分配 + 再走一遍 L4（高价值，后做）
    steps:

      - id: 3.0
        name: "用 phase1 的模型给候选集排序"
        status: pending
        validation:
          - 排序结果写入 log.md，作为后续步骤顺序的依据（模型选，不是预先定死）

      - id: 3.1
        name: "修 OC：Gap #3+#4（Section1 bypass + 循环范围）"
        status: pending
        rationale: 纯 Host 改动，不动 OpenFHE 库也不动 HLS，最低成本验证逻辑正确性
        files_to_modify:
          - src/pke/lib/keyswitch/keyswitch-hybrid.cpp   # OC 分支 :501-587
        changes:
          - "外层循环 `for (usint p = 0; p < sizeP; p++)` 改为 `for (usint p = 0; p < sizeQl + sizeP; p++)`"
          - "Section1 (p < sizeQl)：bypass_digit = p / alpha，该 digit 直接复用原 EVAL 系数；其余 digit 走 BConv"
          - "Section2 (p >= sizeQl)：全部 digit 走 BConv"
          - "删除原 p==0 时填 Q-side complement towers 的代码（:556-573），被 Section1 bypass 取代"
        validation:
          - 编译通过；OC 与 DC 解密结果一致
          - "调用数核对：真 OC 的 BConv 次数 = sizeQl×(dnum-1) + sizeP×dnum = 7（注意 gap 分析 §4 写的 9 算错了，Section2 数了两遍）"
          - 实测 vs phase1 模型预测，偏差 <= 15%

      - id: 3.2
        name: "修 OC：Gap #2（ApproxSwitchCRTBasisSingleTower）"
        status: pending
        files_to_modify:
          - src/core/include/lattice/hal/default/dcrtpoly.h
          - src/core/include/lattice/hal/default/dcrtpoly-impl.h
          - src/core/include/lattice/hal/dcrtpoly-interface.h
          - src/pke/lib/keyswitch/keyswitch-hybrid.cpp
        changes:
          - 复用 dcrtpoly-impl.h:1233-1254 三层循环，内层 `for j` 退化为单值 target_idx
          - FPGA hook 已支持 sizeP=1（FpgaManager.h:614 的 sizeP <= KERNEL_MAX_OUT_COLS），HLS 不用改
        validation:
          - 与原 ApproxSwitchCRTBasis 的第 target_idx 列输出逐元素相等
          - "注意：单 tower BConv 的 AI = alpha/(8(alpha+1)) = 0.083，【低于】full 的 0.15——在 B0 边界下它会让 AI 变差。只有配合 B1/B2 驻留才是赢的"

      - id: 3.3
        name: "B1：per-digit 复合 opcode（片上驻留）"
        status: pending
        rationale: |
          ADR-008 自己预留的「阶段 2 复合 opcode」路径：不动 top.cpp 顶层结构，
          只在 switch(opcode) 加新 case 串联已有子函数。
          模型预测 -29%（vs 修 OC 的 -8%），且强制再走一遍 L3→L4（这次带着 phase2 的时序认知）。
        difficulty_revised_2026_08_04: |
          比原估计【容易得多】，两条核查结论：
          1. 片上缓冲已经够：top.cpp 的 poly_buffer[MAX_LIMBS][SQRT][SQRT] = 8 limb = 256KB，
             而 B1 只需 alpha_d + |C_d| = 5 limb = 160KB。硬件已经在那儿了。
          2. 没有转置代价：poly_buffer 第一维就是 limb，coefficient-wise 访问
             （固定 (r,c) 遍历所有 limb）是普通数组索引 + ARRAY_PARTITION dim=1 并行读。
             「iNTT-BConv-NTT 融合需要转置」的说法只在【跨片外边界】时成立
             （HERA §3.4 说的是 off-chip strided read），全片上时为零代价。
          结论：B1 从「设计一个新复合核」降级为「把 Execute_INTT / Compute_BConv / Execute_NTT
          三个已有子函数串起来，中途不动 poly_buffer」。
        files_to_modify:
          - src/fpga_backend/src/top.cpp        # 新增 OP_DIGIT_MODUP 之类的复合 case
          - src/core/include/FpgaManager.h      # Host 侧新接口
          - src/pke/lib/keyswitch/keyswitch-hybrid.cpp
        changes:
          - 一次调用完成一个 digit 的 INTT→BConv→NTT，中间结果不回 host（也不落 HBM）
          - "片上需求 = alpha_d + |C_d| = l + K 个 limb（当前参数 = 5 limb = 160KB < 已有 256KB）"
          - 依赖 step 1.5 的位序结论：确认三段串联时位序一致（BConv 对置换不变，理论上自动成立）
        validation:
          - 数值正确性
          - 实测 vs 模型预测偏差 <= 15%
          - 重新过 P&R，确认复合 case 没有破坏 phase2 的时序结论
          - "注意 twiddle 架构选择（q6）会影响本 case 的片上预算"

