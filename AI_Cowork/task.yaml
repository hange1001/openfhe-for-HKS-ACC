          - "注意：单 tower BConv 的 AI = alpha/(8(alpha+1)) = 0.083，【低于】full 的 0.15——在 B0 边界下它会让 AI 变差。只有配合 B1/B2 驻留才是赢的"

      - id: 3.3
        name: "B1：per-digit 复合 opcode（片上驻留）"
        status: pending
        rationale: |
          ADR-008 自己预留的「阶段 2 复合 opcode」路径：不动 top.cpp 顶层结构，
          只在 switch(opcode) 加新 case 串联已有子函数。
          模型预测 -29%（vs 修 OC 的 -8%），且强制再走一遍 L3→L4（这次带着 phase2 的时序认知）。
        difficulty_revised_2026_08_04: |
          比原估计【容易得多】，两条核查结论：
          1. 片上缓冲已经够：top.cpp 的 poly_buffer[MAX_LIMBS][SQRT][SQRT] = 8 limb = 256KB，
             而 B1 只需 alpha_d + |C_d| = 5 limb = 160KB。硬件已经在那儿了。
          2. 没有转置代价：poly_buffer 第一维就是 limb，coefficient-wise 访问
             （固定 (r,c) 遍历所有 limb）是普通数组索引 + ARRAY_PARTITION dim=1 并行读。
             「iNTT-BConv-NTT 融合需要转置」的说法只在【跨片外边界】时成立
             （HERA §3.4 说的是 off-chip strided read），全片上时为零代价。
          结论：B1 从「设计一个新复合核」降级为「把 Execute_INTT / Compute_BConv / Execute_NTT
          三个已有子函数串起来，中途不动 poly_buffer」。
        risk_load_imbalance: |
          【2026-08-13 增，源：对表 §3.2】digit 负载不均衡是本步特有风险（B0 下不存在）：
          α_d + |C_d| = l + K 恒等 → 【总量】均衡；但分段看不均衡——
          INTT 段 ∝ α_d（2:1），BConv/NTT 段 ∝ |C_d|（3:4）。
          【何时兑现】顺序执行 B1 复合调用时此项 = 0（总工作量不变）；
          一旦与「异步 offload/双缓冲」叠加（digit d 算、digit d+1 传），
          重叠窗口由较短的段决定，不均衡立即变成空转——
          而这两项恰是 1.4 model_form 认定要【捆绑评估】的超乘性组合。
          先决动作：写出 imbalance(l, dnum) = max_d W_d / avg_d W_d（按段分别定义）的符号式，
          代入参数点，把上界写进 step 3.0 的排序依据。-29% 预测当前未含此项。
        files_to_modify:
          - src/fpga_backend/src/top.cpp        # 新增 OP_DIGIT_MODUP 之类的复合 case
          - src/core/include/FpgaManager.h      # Host 侧新接口
          - src/pke/lib/keyswitch/keyswitch-hybrid.cpp
        changes:
          - 一次调用完成一个 digit 的 INTT→BConv→NTT，中间结果不回 host（也不落 HBM）
          - "片上需求 = alpha_d + |C_d| = l + K 个 limb（当前参数 = 5 limb = 160KB < 已有 256KB）"
          - 依赖 step 1.5 的位序结论：确认三段串联时位序一致（BConv 对置换不变，理论上自动成立）
        validation:
          - 数值正确性
          - 实测 vs 模型预测偏差 <= 15%
          - 重新过 P&R，确认复合 case 没有破坏 phase2 的时序结论
          - "注意 twiddle 架构选择（q6）会影响本 case 的片上预算"

      - id: 3.4
        name: "Buffer 复用：xrt::bo 提出调用体外，Init 一次性分配"
        status: pending
        estimate: 0.5 day
        added: 2026-08-13    # 来源：open_questions q8 的源码核查
        priority_note: |
          【成本最低的候选项，但顺序由步 3.0 的模型决定，不在此预先定死】
          纯 Host 改动，一个文件；不动 HLS、不动 OpenFHE 库、不动 opcode 协议。
          对比：步 3.1 修 OC 要动 OpenFHE 库（天花板 8%）；步 3.3 B1 要动 HLS+Host+库（29%）。
        rationale: |
          xrt::bo 在每次 offload 调用【内部】构造并在作用域结束时析构：
            Execute:402-407 / ModOpBatchOffload:584-586 / BConvOffload:674-676
          45 次调用 x 3 个 buffer = 135 次分配 + 135 次释放。
          xrt::bo 构造不是 malloc，是驱动 ioctl + 设备物理内存分配 + mmap，量级通常数十 us。
          且这段开销【完全不在现有计时窗口内】（见 q8），所以它既没被测到也没被建模。
        files_to_modify:
          - src/core/include/FpgaManager.h
        changes:
          - "把 bo_in1 / bo_in2 / bo_out 提为成员变量，Init 里按 MAX_LIMBS x FPGA_RING_DIM 一次性分配"
          - "调用体内只保留 write / sync / kernel / sync / read"
          - "注意：不同 opcode 的 size 不同，需按最大尺寸分配后用 sub-buffer 或只 sync 有效区间"
        depends_on_measurement: |
          先做 step 1.2 实验 D（Execute 首尾加时间戳，比 sum(墙钟) vs sum(h2d+kern+d2h)）。
          差值即未计时开销。若接近或超过 T_fixed 的 38 us，本步性价比最高。
          若差值很小，说明 xrt::bo 分配被 XRT 内部缓存了，本步降级。
        validation:
          - 数值正确性不变（本步不改变任何计算）
          - 实测 vs 实验 D 测出的未计时开销对账，偏差 <= 15%
          - "复测后更新 global_validation 的 latency_numbers_are_lower_bounds：口径是否已闭合"

