          - 每个方案算出 n_call / n_op / V_h2d / V_d2h / peak（全部符号式）
          - 已有初版见 推导v1 §四（B0=0.32, B1=0.89, B4=2.1 ops/byte，但那是数字版）
          - 补上 evk 口径（CiFlow 表 II 的 AI 是含 evk 的，当前口径不可直接对比）
          - "补 P4 的 MAC 计数：2 × dnum × (l+K) × N（符号表 §6 缺此项）"
          - |
            【2026-08-13 增】产出分层 Roofline 图（本 step 交付物之二）：
            三条带宽屋顶 = PCIe（~3GB/s，下界口径）/ HBM / 片上 AXI（512-bit × 166MHz ≈ 10.6 GB/s），
