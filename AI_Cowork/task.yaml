      - id: 1.4
        name: "L2：三模型 v1 + 资源约束 + 能耗记账 + 预测对账"
        status: pending
        deliverable: 可执行的模型（脚本或表格），输入循环序，输出预测延迟 + 资源可行性 + 能耗
        design_constraint: |
          【硬约束 1】模型的自变量必须是 (n_call, V, peak)，这三个量由循环序推出。
          模型里若出现 `if (strategy == OC)`，那它就是查找表不是模型。
          【硬约束 2】自变量里也不能出现硬编码的 4096 / 3 / 2。
          T(N, l, K, dnum, PE, f, BW, T_fixed) —— 全部是自变量。
          这样「要不要按工业参数考虑」就不是问题：同一个模型两组参数各求一次值。
        warmup_exercise: |
          【2026-08-13 增】本 step 的热身推导，30 分钟，闭卷（不开 task.yaml / 对表 / 推导v1）。
          来源：08-13 quiz 里 Q2(Amdahl) 与 Q3(超乘性机制) 得零分，本练习是其处方。
          规格照 step 1.1 的 exercise_order：给定什么、推什么、什么算过关，全部写明。

          ── 练习 A：Amdahl 三项记账 ────────────────────────────
          【给定】DC 在 Precompute 区间的三项：计算 1785 us / 传输 393 us / 控制 570 us
          【推】
            A1  总时间与三项占比（百分比）
            A2  先写 Amdahl 一般式，再代入：计算部分【无限快】时的加速比上界
            A3  计算部分只快 10 倍（非无限）时的加速比
            A4  【逆用】若要端到端快 2 倍，计算部分至少要快几倍？
            A5  真 OC 的预测值是 2523 us（比 DC 快 8%）。已知它把计算从 1785 降到 1473，
                但传输 393->404、控制 570->646。核对净减是否等于 225 us；
                然后用一句话说明：为什么「8%」是一个【诊断结果】而不只是一个成绩
          【过关】A2 与 A4 两个数都对，且 A5 能说出「修 OC 一边省计算一边加调用」

          ── 练习 B：超乘性四行表 ──────────────────────────────
          【给定】
            量                  值                              来源层
            单次 call 三段      H2D 40.6 / kernel 123.0 / D2H 19.2 us   L5 实测（下界口径）
            phase4 片内目标     117K -> 46K cycles，即 2.55 倍          L3 csynth
          【映射（初稿漏写，2026-08-13 补）】
            微架构优化【只】作用于 kernel 段：kernel_new = 123.0 / 2.55 = 48.2 us
            传输段合计 = H2D + D2H = 40.6 + 19.2 = 59.8 us
          【重叠的定义（初稿漏写）】
            稳态双缓冲：call i 的 H2D/D2H 与 call i-1 的 kernel 重叠，
            于是每 call 的摊销时间由较慢的一侧决定。
          【假设（必须先写下再算）】微架构改动纯片内，不改变 PCIe 字节数
          【推】
            B0  【先答这题】2.55 倍是 csynth 【周期】比，123.0 us 是上板【墙钟】。
                什么条件下才能直接相除？至少说出两个条件。
                （这题就是你自己提出的质问，它比后面六题都重要）
            B1  现状单次 call
            B2  只做微架构：单次 call 与加速比
            B3  只做传输重叠：先写出重叠后单次 call 的【公式形式】，再代入
            B4  两个都做：单次 call 与加速比
            B5  B4 的加速比 vs (B2 加速比 x B3 加速比)，哪个大、大多少
            B6  【禁止写式子，两句话以内】为什么一起做会超过各自的乘积
            B7  B4 之后瓶颈是哪一段？（提示：你 08-13 自己说过「限制因素转移」）
          【过关】B0 说出两个条件，B3 写出 max() 形式（不是先算再解释），
                  B5 算出 3.06 > 2.52，B6 说清机制

          ── 对账 ──────────────────────────────────────────────
          推完再打开本 step 的 model_form 比对。
          错了不要紧，要能指出【错在哪一步】——按 predict_before_measure 的精神，
          偏差比结果重要。对账结果记入 log.md。
        model_form: |
          目标函数（延迟）：
            T = sum_op n_op·c_op  +  V/BW_eff  +  n_call·T_fixed
                └ 计算模型 ┘         └ 存储模型 ┘   └ 控制模型 ┘

          【2026-08-13 增补：必须并列算两个版本】
            串行版：T = T_comp + T_mem + T_ctrl                          ← 现状，加号
            重叠版：T ≈ max(T_comp, T_mem) + ramp_up + drain + T_ctrl_不可重叠
          加号成立【已由源码证实】（open_questions q8：offload 完全阻塞，并发度=1），
          但成立的原因是实现如此，不是物理限制 → 两版差值 = 「异步 offload / 双缓冲」的收益上界。

          【超乘性——排期时必须捆绑】
          用 phase4 的 117K→46K（片内 2.55x）代入单次 call（现状 40.6+123.0+19.2 = 182.8 us）：
            只做微架构    40.6 + 48.2 + 19.2 = 108.0 us  → 1.69x
            只做传输重叠  max(59.8, 123.0)   = 123.0 us  → 1.49x
            两个都做      max(59.8,  48.2)   =  59.8 us  → 3.06x
          1.69 x 1.49 = 2.52 < 3.06 —— 单独做任一项，收益都被另一项的存在低估。
          这是 + 变 max() 的直接后果 → 步 3.0 排序时这两项【不能各自单独算】。
          并且做完之后瓶颈换人：59.8 > 48.2，PCIe 接管瓶颈
          （回答 推导v1 §7 拷问 #1 的兄弟问题）。
          待验证假设：59.8 us 中约 38 us 是 T_fixed，能否被重叠藏掉未知 → step 1.2 实验 B。

          【Amdahl 记账——用于事前判断改动值不值得做，不是事后算加速比】
            DC 三项占比 65% / 14% / 21%（1785 / 393 / 570 us，共 2748）
            计算清零的上界 = 2748 / 963 = 2.85x
            修 OC 1.09x（只攻计算的一小块）／ OC+驻留 1.41x（三项同攻）
            → 8% 本身是一个诊断结果：说明修 OC 没往主要矛盾上使劲
          注意：分母 2748 是【下界】（见 global_validation），实测未计时开销 X 后须重算，
          且 X 全部落在非计算侧 → X 越大，2.85x 这个上界越低。

          资源约束【是约束不是目标】：
            peak(scheme) + twiddle(N) + 常驻项  <=  B_onchip
          写成 minimize T s.t. R <= Budget，【不要】写成 minimize T + lambda·Area。
          理由：FPGA 资源是离散硬上限，超了是布不进去（fail），不是变贵。
          加权求和是 ASIC 写法，在 FPGA 上没有意义。
          注：L2 能直接控制的资源【只有片上存储】——LUT/FF/DSP 由 L3 决定。
          （这也是 CiFlow 全篇只谈 on-chip SRAM 而不谈 DSP/LUT 的原因。）

          能耗【记账项，phase2 前不参与方案筛选】：
            E = sum_op n_op·e_op  +  V·e_bit  +  P_static·T
          复用同一套 n_op / V / n_call，只换一组系数，几乎零额外成本。
        power_deferral_rationale: |
          【为什么现在不让能耗参与决策——必须写明，这是 traceability 规则的一部分】
          在 L2 层，性能与功耗【同向】：省数据搬运既省时间又省能量，不产生取舍。
          量级粗估（文献口径，非实测）：DC 一次 HKS 计算能耗 ~13 uJ，PCIe 搬运能耗 ~142 uJ，
          搬运约为计算的 10 倍——与延迟侧结论方向一致。
          功耗真正产生取舍是在 L3 的两个旋钮上：PE_PARALLEL 上调（功耗线性增）、
          频率上调（超线性增，还要提压）。所以能耗到 phase2/phase3 才上场。
          系数可测：xbutil examine --device <bdf> --report electrical
        current_bottleneck_note: |
          【phase2 的输入】csynth 显示 Compute_CG_NTT 用 LUT 4% / FF 1% / DSP 3% / BRAM 4% / URAM ~0%，
          资源用了个位数百分比却只能跑 166MHz（6ns，从 4ns 退了两次）。
          → 当前瓶颈是【时序】不是【资源】，且关键路径问题不是资源竞争而是逻辑深度/布线。
          → phase2 的方向应是「花资源换时序」（加流水级、复制逻辑降扇出、拆长组合链），
            而不是省资源。先查关键路径，才知道那 96% 的空闲资源该往哪儿花。
        changes:
          - c_op 来自 csynth × 上板修正系数（当前拟合值 1.35，phase2 后可换成有依据的值）
          - BW_eff 与 T_fixed 来自 step 1.2 实验 B
          - B_onchip(N) 与 twiddle(N) 来自 step 1.6
          - e_op / e_bit / P_static 标「待标定」，先不填值
        validation:
          - 三策略预测 vs 实测误差 <= 15%
          - "【先写后测】预测三策略落在 5% 以内——若实测印证则模型成立且得到重要结论；若实测偏差大则模型漏项"
          - 模型能对一个从未实测过的调度点做出预测（B1 或 batch=2）
          - 资源约束能筛掉至少一个方案（若一个都筛不掉，说明约束式写松了或参数太小）
          - 能耗式写进模型且标明「不参与筛选」及其理由

