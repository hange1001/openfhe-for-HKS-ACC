# ============================================================
  - id: phase4
    name: "L3 剩余优化 + L5 定量刻画"
    status: pending
    estimate: flexible
    depends_on: [phase2]
    steps:
      - id: 4.1
        name: "L3-L2：DATAFLOW 拆 load/compute/store，Limb 间流水"
        status: pending
        expected: 8 Limbs 117K → 87K cycles
      - id: 4.2
        name: "L3-L3：URAM 全量预加载 twiddle + BUTTERFLY 拆循环达 II=1"
        status: pending
        expected: 87K → ~46K cycles，累计 7.5x
      - id: 4.3
        name: "对账 HERA：逐条核对它的 6 个优化"
        status: pending
        rationale: HERA 是参照系，做完一件对一次答案，比闷头摸索快
        changes:
          - "① ModUp/ModDown 全片上  ② BConv+NTT 单 limb 融合  ③ KeySwitch 层穷尽融合"
          - "④ 选择性 k-limb 计算   ⑤ Rescale 并进 ModDown    ⑥ Hoisting"
          - "资源参照：HERA @U280 300MHz / 256 lanes / 4352 DSP / 35.6MB 片上 / 66.4% LUT"

# ============================================================
# 待回答问题
# ============================================================
open_questions:
  - id: q1
    q: "工业参数能否覆盖 PCIe 固定开销？"
    a: |
      分两半。T_fixed（每次调用的常数）会被摊薄：N=2^12 时占 21%，N=2^16 时降到 1.3%。
      但 T_transfer（随 N 线性）不会——单算子 AI = log N / 32，从 0.375(N=2^12) 只涨到 0.5(N=2^16)，
      16 倍参数只换来 1.33 倍。且一旦算力工业化，机器平衡点从 0.22 跳到 25.6 ops/byte，
      单算子 AI 差 51 倍，整条 HKS 全融合也只到 ~4.4，仍差 5.8 倍。
      结论：参数上推解决固定开销，不解决传输开销。真正的出路是密文常驻加速器、跨多次 HKS 复用。
      详见 phase1 step 1.3 与 L1L2_推导v1.md。
  - id: q2
    q: "R2（批深度）与 Hoisting 的界限在哪？"
    a: |
      HERA 的 ⑥ Hoisting（Halevi-Shoup）摊薄的是 ModUp 的【计算】，复用条件是同一密文的多次 rotation，
      是教科书技术。R2 要立住必须强调：摊薄的是 offload【固定开销】，复用跨【独立密文】的 HKS 实例。
      建议在 ADR-005 里直接加一句界定。
  - id: q3
    q: "MemoryTracker 的 peak 单位错了，要不要顺手修？"
    a: |
      要。当前用 sizeP(=2) 作单位，实际 BConv 输出基是补基 |C_d| = sizeQlP - alpha_d（=3 或 4）；
      且 OC 分支的 peak_p_towers=1 是硬编码常量而代码持有完整 fullCompl。
      真值：DC 128KB / MP 224KB / 伪OC 128KB —— 伪OC 相对 DC 的峰值优势为 0。
      修复点在 phase1 step 1.3。
  - id: q4
    q: "numPartQl=1 单 digit 场景，Section1 bypass 如何退化？"
    a: 应等价于无 bypass，全部走 BConv（CiFlow 的 BTS1 就是 dnum=1，MP 与 DC 同实现）
  - id: q5
    q: "最后一个 digit 残缺（sizePartQl < alpha）时 bypass 逻辑怎么算？"
    a: |
      按 partsCt[bypass_digit].GetNumOfElements() 而非 alpha 算。
      根因：l 除不尽 alpha 时最后一个 digit 短。当前 l=3, alpha=2 → digit1 只有 1 个 tower，
      所以 |C_1|=4 而 |C_0|=3。这是小参数产物；做参数上推时优先选能整除的 (l, dnum) 组合。

  - id: q6
    q: "twiddle 是压缩存储吗？工业参数下会不会撞片上墙？"
    status: answered_2026_08_04
    a: |
      【不是压缩】PACK_RATIO = 512/64 = 8 是 512-bit AXI 的打包比（ADR-004），
      PACKED_TW_SIZE 是「多少拍」不是「多少字节」。加载循环 cg_ntt.cpp:389-398
      写满 idx=0..24575，覆盖完整 local_twiddle[12][2048]，字节数不变。

      【真正的发现：两套并存的 twiddle 内存架构】
        A) Compute_CG_NTT（cg_ntt.cpp:365）：local_twiddle[STAGE][CG_HALF_N]
           = 每 limb 从 HBM 流式载入，片上 192KB（csynth 报告：8 个 local_twiddle 实例 × 1 URAM）
        B) top.cpp（:33-34）：NTT/INTTTwiddleFactor[MAX_LIMBS][STAGE][CG_HALF_N]
           = 全 8 limb 常驻，片上 3.0MB
        Host 的 Execute(OP_NTT,...) 走的是 B；csynth 基准 15,701 cyc 来自 A。
        【微基准与部署核不是同一个设计】——A 每 limb 花 2×3075=6150 周期加载 twiddle
        （占 14,644 的 42%），B 在 OP_INIT 一次性载入后为零。又一处口径不同源。

      【墙的位置】U55C 片上约 43MB：
        N=2^12:  A 192KB / B 3.0MB(7%)     两者都行
        N=2^14:  A 917KB / B 14.7MB(34%)   B 吃紧
        N=2^16:  A 4.2MB(10%) / B 67MB(154%)  B 不可能，A 可行
      但 A 在 N=2^16 时 twiddle 流量 = 4.2MB/limb vs 数据 512KB/limb → 8 倍。

      【根因】CG-NTT 存 STAGE×(N/2) 个 twiddle，标准 NTT 只需 N/2（跨 stage 复用）
      → 冗余 log N 倍。ADR-003 用这个冗余换掉了变 stride MUX，在 N=2^12 无所谓（192KB），
      在 N=2^16 不划算。【ADR-003 的决策在工业参数下失效】——这正是 HERA §3.1
      把「NTT 分解」放在所有优化最前面的原因：消掉这个冗余。
    followup: phase1 step 1.6 决定保留哪一套；若走工业参数则必须先做 NTT 分解

  - id: q7
    q: "docs/reports/ 下的综合报告还有效吗？"
    a: |
      【存疑】csynth 报告里 local_twiddle 深度 3072 反推 ARRAY_PARTITION factor = 8，
      而 define.h:33 现在是 PE_PARALLEL=4。报告对应的是旧配置。
      另外 cg_ntt.cpp:191-192 的 pragma 硬编码 factor=8（没引用 PE_PARALLEL 常量），
      :233 注释写 factor=16 —— ADR-002 的「统一引用常量」已被破坏。
      在 phase2 重新综合前，docs/reports/ 下所有资源与延迟数字都应视为旧配置口径。

