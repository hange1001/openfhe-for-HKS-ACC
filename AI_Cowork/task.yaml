            硬要求：每个点标注分母跨的是哪条边界（AI_pcie / AI_axi，见符号表 §9.1），
            混用边界的图无效。画图前先声明系统边界（含 host↔加速器）——
            这条边界线是本项目与 HERA/CiFlow 框图的差异所在。
        open_subquestion: |
