# ============================================================
# 贯穿全程的验收项（每个 phase 都要满足）
# ============================================================
global_validation:
  - id: traceability
    rule: |
      任何写进文档的数字，必须能回答「它由哪一层的哪个约束推出」。
      当前答不上来的存量问题（本任务结束前须全部答上）：
        - 6ns 是怎么定的？关键路径在哪个模块？          → phase2
        - PE_PARALLEL 到底是几？define.h=4 / cg_ntt.cpp:191 硬编码 8 / :233 注释 16 / csynth 报告对应 8
                                                        → phase2（ADR-002「统一引用常量」已被破坏）
        - 45 次 kernel 调用里那 30 次是什么？            → phase1 step 1.2
        - 787 MB/s 是带宽还是被固定开销污染的折算值？    → phase1 step 1.2
        - CG-NTT 的 bit-reversal 在哪一步被抵消的？      → phase1 step 1.5
      【2026-08-04 已答】twiddle 是否压缩存储：
        PACK_RATIO=512/64=8 是 AXI 打包比不是压缩，字节数不变（详见 open_questions q6）。
  - id: predict_before_measure
    rule: |
      任何实测之前，先写下预测值和 ±15% 区间，存入 log.md。
      测完再对账。偏差 >15% 先查漏项，禁止调系数凑数。
  - id: doc_ref_format
    rule: |
      【2026-08-13 新增】引用文档一律写成「别名 §章节」，别名必须出自顶部 doc_refs。
      禁止三种写法（本次清理前各出现过）：
        ① 裸章节号 ——「与 §4 已查实…」：哪个文件的 §4？
        ② 别名不在表里 ——「笔记 §4.5」「gap 分析 §4」：靠上下文猜
        ③ 正文写全路径 ——「docs/notes/L1_优化术语对表.md §3.1」：路径变了要改 N 处
      引用 doc_refs.external 里的文档（Portfolio / HERA / CiFlow）前，
      必须先确认本地能打开。拿不到的文献不得作为任何推导或数字的依据——
      这是 traceability 规则的延伸：出处不可核对 = 拍脑袋常数。

  - id: latency_numbers_are_lower_bounds
    rule: |
      【2026-08-13 新增】现有全部 FPGA 侧延迟数字（182.8 us/call、8.229 ms 等）
      必须标注为【下界】，不是墙钟。
      理由：FpgaManager.h 的计时窗口（Execute:415-429）只覆盖 sync/kernel/sync 三段，
      未计入每次调用的 xrt::bo x3 分配（:402-407）、bo.write() x2、bo_out.read()、以及 bo 析构。
      → 引用这些数字时必须带「下界」二字；重新标定前不得用于任何加速比声明。
      详见 对表 §3.1。

